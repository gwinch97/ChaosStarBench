kind: StressChaos
apiVersion: chaos-mesh.org/v1alpha1
metadata:
  namespace: hotelreservation
  name: reservation-memhog-nn
spec:
  selector:
    namespaces:
      - hotelreservation
    labelSelectors:
      app: reservation-hotelres
  mode: one
  stressors:
    memory:
      workers: 12
      size: '6120MiB'
  duration: '3600s'
