kind: StressChaos
apiVersion: chaos-mesh.org/v1alpha1
metadata:
  namespace: hotelreservation
  name: frontend-memhog
spec:
  selector:
    namespaces:
      - hotelreservation
    labelSelectors:
      app: frontend-hotelres
  mode: one
  stressors:
    memory:
      workers: 1
      size: '400MiB'
  duration: '3600s'
