kind: StressChaos
apiVersion: chaos-mesh.org/v1alpha1
metadata:
  namespace: hotelreservation
  name: recommendation-memhog
spec:
  selector:
    namespaces:
      - hotelreservation
    labelSelectors:
      app: recommendation-hotelres
  mode: one
  stressors:
    memory:
      workers: 1
      size: '95%'
  duration: '3600s'
