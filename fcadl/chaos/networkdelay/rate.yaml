kind: NetworkChaos
apiVersion: chaos-mesh.org/v1alpha1
metadata:
  namespace: hotelreservation
  name: rate-delay
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - hotelreservation
    labelSelectors:
      app: rate-hotelres
  delay:
    latency: '50ms'
    correlation: '100'
    jitter: '50ms'
  duration: '3600s'
