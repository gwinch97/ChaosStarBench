kind: StressChaos
apiVersion: chaos-mesh.org/v1alpha1
metadata:
  namespace: hotelreservation
  name: user-cpuhog
spec:
  selector:
    namespaces:
      - hotelreservation
    labelSelectors:
      app: user-hotelres
  mode: one
  stressors:
    cpu:
      workers: 2
      load: 100
  duration: '3600s'
