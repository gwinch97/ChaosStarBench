apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-minikube-local-pv
spec:
  capacity:
    storage: 8Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: csi-hostpath-sc
  volumeMode: Filesystem
  local:
    path: /data/prometheus
  # nodeAffinity forces this PV to only bind on the "minikube" node
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - minikube

