kind: StressChaos
apiVersion: chaos-mesh.org/v1alpha1
metadata:
  namespace: socialnetwork
  name: hts-memleak
spec:
  selector:
    namespaces:
      - socialnetwork
    labelSelectors:
      app: home-timeline-service
  mode: one
  stressors:
    memory:
      workers: 1
      size: "95%"
  duration: '3600s'
