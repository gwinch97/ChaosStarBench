apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: uts-delay
spec:
  action: delay
  mode: one # for all pods
  selector:
    namespaces:
      - socialnetwork
    labelSelectors:
      app: user-timeline-service
  delay:
    latency: '50ms'
    correlation: '100'
    jitter: '50ms'
