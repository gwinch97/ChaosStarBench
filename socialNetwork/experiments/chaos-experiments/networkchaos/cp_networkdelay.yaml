apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: delay
spec:
  action: delay
  mode: all # for all pods
  selector:
    namespaces:
      - socialnetwork
    labelSelectors:
      app: compose-post-service
  delay:
    latency: '250ms'
    correlation: '100'
    jitter: '100ms'
